name: Build and Release Portable Version

on:
  push:
    # Two-part tags are used here (v0.2, v1.0), so a 'v*.*.*' pattern would
    # never match. 'v*' covers both shapes.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2)'
        required: true

permissions:
  contents: write

jobs:
  build-portable:
    name: Build Portable Version
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Before the build, so a broken commit never spends ten minutes
      # downloading an interpreter first.
      - name: Run tests
        run: python -m unittest discover -s tests -t .
        shell: pwsh

      - name: Resolve version and artifact name
        id: names
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.tag }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          # The zip name is built by version.py; asking Python for it keeps
          # this workflow from drifting out of sync with the build script.
          $zip = python -c "from dttwl.version import ZIP_FILE_NAME; print(ZIP_FILE_NAME)"
          $bat = python -c "from dttwl.version import BAT_FILE_NAME; print(BAT_FILE_NAME)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip"         >> $env:GITHUB_OUTPUT
          "bat=$bat"         >> $env:GITHUB_OUTPUT
          Write-Host "Building $version -> $zip"

      # The .ps1 directly, not make_portable.bat: the .bat ends in `pause`,
      # which has no place in a non-interactive runner.
      - name: Build portable version
        shell: pwsh
        run: .\packaging\make_portable.ps1

      - name: Check build output
        shell: pwsh
        run: |
          if (-not (Test-Path "portable")) { throw "portable folder not found" }
          $zip = "${{ steps.names.outputs.zip }}"
          if (-not (Test-Path $zip)) { throw "$zip not found" }
          $size = (Get-Item $zip).Length / 1MB
          Write-Host "Portable zip: $zip ($([math]::Round($size, 2)) MB)"

      # softprops/action-gh-release creates the release or updates an existing
      # one and uploads the asset in a single step. The archived
      # actions/create-release@v1 fails outright when the release already
      # exists, which is exactly what happens when a tag is cut in the web UI.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.names.outputs.version }}
          name: DTT Whitelist Validator ${{ steps.names.outputs.version }}
          files: ${{ steps.names.outputs.zip }}
          body: |
            ## Portable version — no installation, no internet needed

            ### Install
            1. Download `${{ steps.names.outputs.zip }}`
            2. **Right-click the zip → Properties → Unblock → OK** (required on
               every machine; without it Windows blocks the extracted files)
            3. Extract it
            4. Run `${{ steps.names.outputs.bat }}`

            ### Requirements on the test machine
            - Windows 10 or later
            - Intel Dynamic Tuning Technology installed and reachable on
              `localhost:8888`
            - No Python installation and no internet connection

            ### Included
            - Self-contained CPython 3.11 runtime with tkinter
            - openpyxl, for the .xlsx report
            - A command-line launcher

            Reports are written to `Documents\DTT Whitelist Validation Reports`
            by default; the folder is configurable on the Settings tab.

            See [README.md](https://github.com/${{ github.repository }}/blob/${{ steps.names.outputs.version }}/README.md),
            and [AGENTS.md](https://github.com/${{ github.repository }}/blob/${{ steps.names.outputs.version }}/AGENTS.md)
            before changing the code.

      - name: Upload portable folder for inspection
        uses: actions/upload-artifact@v4
        with:
          name: portable-folder-${{ steps.names.outputs.version }}
          path: portable/
          retention-days: 30
